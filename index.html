    <div

      <p>哦？异界的旅人，你们或许可以称呼我为，“愚者”[神秘地微笑]</p>
      <p>…………</p>
      <p>hh开个玩笑，因为我的名字读起来和“愚者”有点像，大家可以叫我“阿哲”</p>
      <p>
        许多人都说我很像infp，不过，我本人并没有测过（因为不想做题），但我们姑且信之,道友们也可以以此为参考来和我相处
      </p>
      <p>
        我的兴趣的话（思考ing），我平时会和朋友打打羽毛球、乒乓球，一起当街溜子啥的，都是氛围很放松的那种
      </p>
      <p>
        我对心理学、哲学方面的知识比较感兴趣，心理学对我来说是白月光的存在，它有帮到过我许多
      </p>
      <p>唔……就这些吧，更多的东西，我希望是在我们彼此的相处中慢慢了解……</p>
      <p>那么，请多关照！来自异界的旅人</p>
